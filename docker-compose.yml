services:
  postgres:
    image: postgres:16-alpine
    container_name: bps-2api-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${BPS_DB_USER:-bps}"
      POSTGRES_PASSWORD: "${BPS_DB_PASSWORD:-bps}"
      POSTGRES_DB: "${BPS_DB_NAME:-bps}"
    volumes:
      - ./data-pg:/var/lib/postgresql/data
    # 不映射到公网；容器间走 compose 网络
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BPS_DB_USER:-bps} -d ${BPS_DB_NAME:-bps}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bps-2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BPS_IMAGE_REPO:-your-dockerhub-user/bps-2api}:${BPS_APP_TAG:-app-latest}
    container_name: bps-2api
    restart: unless-stopped
    ports:
      - "${BPS_HOST_PORT:-8301}:8080"   # 外部端口 → 容器 8080（API + /admin/）
    env_file:
      - path: .env                          # 密钥（DB 口令 / API Key / 加密键），600 权限
        required: false
    environment:
      WEB2API_ADMIN_STATIC: /app/web
      WEB2API_ALLOW_REMOTE_ADMIN: "true"
      TZ: Asia/Shanghai
      # off=停保活刷新循环（上游 auth 面风控时的止血闸，见 keepalive_boot.go）
      WEB2API_KEEPALIVE: "${WEB2API_KEEPALIVE:-}"
      # 上游站点地址（bps / ChatGPT Excel 插件 agent）；不设置会用内置默认
      VENDOR_API_BASE_URL: "${VENDOR_API_BASE_URL:-https://bps.openai.com/basispoints/api}"
      # Anthropic 入口的思考档位上限：thinking.budget_tokens/output_config.effort 会被压到这一档
      # （默认 low，防止 max 档长思考）。OpenAI 入口的 reasoning_effort 不受它限制。
      WEB2API_MAX_EFFORT: "${WEB2API_MAX_EFFORT:-high}"
      # 没指定模型时的兜底（/v1/messages 不带 model、以及无法识别的模型名都会落到它）。
      WEB2API_DEFAULT_MODEL: "${WEB2API_DEFAULT_MODEL:-gpt-5.6-sol}"
      # 注入给上游的系统指令：留空用内置默认，off 关闭，也可直接给文本或指向文件。
      # bps 上游自带 Excel agent 提示词，默认模式 off（不叠加）。
      BPS_SYSTEM_PROMPT: "${BPS_SYSTEM_PROMPT:-}"
      BPS_SYSTEM_PROMPT_FILE: "${BPS_SYSTEM_PROMPT_FILE:-}"
      # 本站 API 鉴权 Key（设置后调用 /v1/chat/completions 需 Authorization: Bearer <key>；管理端同 key）
      # WEB2API_API_KEY: your-admin-key
      DATABASE_URL: "postgres://${BPS_DB_USER:-bps}:${BPS_DB_PASSWORD:-bps}@postgres:5432/${BPS_DB_NAME:-bps}?sslmode=disable"
      # 不想要 PostgreSQL：把上面的 DATABASE_URL 注释掉，会退化为 /data 下的 JSON 文件存储（单机模式）
      # WEB2API_TLS_CERT: /certs/fullchain.pem
      # WEB2API_TLS_KEY: /certs/privkey.pem
      # WEB2API_PROXY: http://127.0.0.1:7890
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data                # JSON 文件存储 / 旧数据迁入
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 免账号自测模式：内置模拟后端（无需任何真实账号即可体验全部功能）
  # 用法：docker compose --profile mock up -d
  mock:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: Dockerfile
    image: bps-2api:mock
    container_name: bps-2api-mock
    restart: unless-stopped
    command: ["--mock", "--listen", "0.0.0.0:8080"]
    ports:
      - "18080:8080"               # mock 模式端口（避免与主实例冲突）
    volumes:
      - ./data-mock:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
